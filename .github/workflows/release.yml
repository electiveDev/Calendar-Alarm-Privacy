name: Tagged Android release build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run tests and lint
        run: ./gradlew test lintDebug
      - name: Run privacy check
        run: bash scripts/privacy-check.sh
      - name: Build debug APK for testing
        run: ./gradlew assembleDebug
      - name: Upload tagged APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalendarAlarmPrivacy-APK-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/app-debug.apk

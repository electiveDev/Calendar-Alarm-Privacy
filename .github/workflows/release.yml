name: Android GitHub Release

on:
  workflow_run:
    workflows: ["Android APK"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Check stable signing configuration
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Stable signing secrets are not configured; no GitHub Release will be published."
          fi

      - name: Checkout tested commit
        if: steps.signing.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Java
        if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        if: steps.signing.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v4
      - name: Decode stable Android keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/calendar-alarm-privacy-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"
          echo "ANDROID_KEYSTORE_FILE=$ANDROID_KEYSTORE_FILE" >> "$GITHUB_ENV"
      - name: Run tests and lint
        if: steps.signing.outputs.ready == 'true'
        run: ./gradlew test lintDebug
      - name: Run privacy check
        if: steps.signing.outputs.ready == 'true'
        run: bash scripts/privacy-check.sh
      - name: Build stable release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Prepare release APK
        if: steps.signing.outputs.ready == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk Calendar-Alarm-Privacy.apk
      - name: Publish GitHub Release
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" \
            "Calendar-Alarm-Privacy.apk" \
            --target "$RELEASE_TARGET" \
            --title "Calendar Alarm Privacy Build #${GITHUB_RUN_NUMBER}" \
            --notes "Automated signed build from commit ${RELEASE_TARGET}."
      - name: Remove temporary keystore
        if: always() && steps.signing.outputs.ready == 'true'
        run: |
          if [[ -n "${ANDROID_KEYSTORE_FILE:-}" ]]; then
            rm -f "$ANDROID_KEYSTORE_FILE"
          fi

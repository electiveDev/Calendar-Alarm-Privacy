name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: ./gradlew test
      - name: Run lint
        run: ./gradlew lintDebug
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Run privacy check
        run: bash scripts/privacy-check.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CalendarAlarmPrivacy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
